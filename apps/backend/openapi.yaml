openapi: 3.0.3

info:
  title: Koa API
  description: Default OpenAPI specification for a Koa.js API using koa-oas3
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints

paths:
  /user/{id}/cycle-config:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get: 
      tags: 
        - Cycle Config
      summary: Users Cycle config
      description: Return the user cycle config
      operationId: getUserCycleConfig
      responses:
        '200': 
          description: Returning user cycle config
          content: 
            application/json:
              schema:
                type: object
    post: 
      tags: 
        - Cycle Config
      summary: Users Cycle config
      description: Return the user cycle config
      operationId: editUserCycleConfig
      responses:
        '200': 
          description: Returning user cycle config
          content: 
            application/json:
              schema:
                type: object
  /user/{id}/cycle/start:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
        - Cycles
      summary: Cycle start event
      description: It creates a cycle and start it.
      operationId: startCycle
      responses:
        '201':
          description: Cycle created
          content:
            application/json:
              schema:
                type: object
  /user/{id}/cycle/{cycle_id}/events:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: cycle_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
        - Cycles
      summary: Events of a cycle
      description: It registers the possible events of a cycle
      operationId: eventsCycle
      responses:
        '200':
          description: Event registered
          content:
            application/json:
              schema:
                type: object

          
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns API status
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          example: 12345
      required:
        - status
