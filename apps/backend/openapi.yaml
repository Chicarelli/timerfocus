openapi: 3.0.3

info:
  title: Koa API
  description: Default OpenAPI specification for a Koa.js API using koa-oas3
  version: 1.0.0

servers:
  - url: /
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints

paths:
  /user/{id}/cycle-config:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get: 
      tags: 
        - Cycle Config
      summary: Users Cycle config
      description: Return the user cycle config
      operationId: getUserCycleConfig
      responses:
        '200': 
          description: Returning user cycle config
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/CycleConfig"
    post: 
      tags: 
        - Cycle Config
      summary: Users Cycle config
      description: Return the user cycle config
      operationId: editUserCycleConfig
      requestBody:
        description: New User Cycle
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleConfig"
      responses:
        '200': 
          description: Returning user cycle config
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/CycleConfig"
        '404':
          description: Config not found for this user
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Config not found for this user"
        '422':
          description: Invalid request
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid request"
  /user/{id}/cycle/start:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
        - Cycle
      summary: Cycle start event
      description: It creates a cycle and start it.
      operationId: startCycle
      requestBody:
        description: Create a new user cycle
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCycle"
      responses:
        '201':
          description: Create a cycle
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: a5fa431a-08fb-4ac1-9a9a-f8f1058e55a7
        '422':
          description: Invalid request
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid request"
        '404':
          description: Config not found for this user
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Config not found for this user"
  /user/{id}/cycle/{cycle_id}/events:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: cycle_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
        - Cycle
      summary: Events of a cycle
      description: It registers the possible events of a cycle
      operationId: eventsCycle
      requestBody:
        description: "Register a new event for a cycle"
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [heartbeat, pause, unpause, end]
      responses:
        '200':
          description: Event registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: a5fa431a-08fb-4ac1-9a9a-f8f1058e55a7
                  userId:
                    type: string
                    example: a5fa431a-08fb-4ac1-9a9a-f8f1058e55a7
                  type: 
                    type: string
                    enum: [default, learning]
                    example: "default"
                  startedAt:
                    type: string
                    format: date-time
                  endedAt:
                    type: string
                    format: date-time
                  lastHeartbeatAt:
                    type: string
                    format: date-time
                  acumulateSeconds:
                    type: number
                  maxAllowedSeconds:
                    type: number
                  status:
                    type: string
                    enum: [running, pauses, end]
                  pauses:
                    type: number
                  endedReason:
                    type: string
                    enum: [manual, timeout, max_time_reached, new_cycle_started]
        '422':
          description: Invalid request
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid request"
        '404':
          description: Config not found for this user
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Config not found for this user"
          
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns API status
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    CreateCycle:
      type: object
      properties:
        type:
          type: string
          enum: [default, learning]
      required:
        - type
    CycleConfig:
      type: object
      properties:
        mode:
          type: string
          enum: [default, learning]
        workTime:
          type: number
          example: 25
        thoughfulWorkTime:
          type: number
          example: 3
        shortBreakTime:
          type: number
          example: 5
        longBreakTime:
          type: number
          example: 10
        shortIntervalCount:
          type: number
          example: 2
      required:
        - mode
        - workTime
        - thoughfulWorkTime
        - shortBreakTime
        - longBreakTime
        - shortIntervalCount
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          example: 12345
      required:
        - status
